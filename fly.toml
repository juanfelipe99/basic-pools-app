app = "basic-pools-app"
primary_region = "mia"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite:////data/polls.db"
  STATIC_DIR = "/app/static"
